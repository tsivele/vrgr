# Ρυθμίσεις Streamlit για το VRGR.
[server]
# Reel 4K από κινητό φτάνει εύκολα τα 300 MB — το default των 200 MB δεν αρκεί.
maxUploadSize = 400
# Ακούει σε όλες τις διεπαφές ώστε να είναι προσβάσιμη από άλλη συσκευή του
# ΙΔΙΟΥ δικτύου (π.χ. το Windows ή το κινητό σου). Στο τοπικό σου δίκτυο μόνο —
# δεν βγαίνει στο internet. Αν θες να την κλειδώσεις πάλι μόνο στο Mac,
# ξαναβάλε address = "127.0.0.1".
address = "0.0.0.0"
headless = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#5b9dff"
backgroundColor = "#0e1014"
secondaryBackgroundColor = "#161a21"
textColor = "#e8ecf2"
